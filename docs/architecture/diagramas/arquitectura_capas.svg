<svg width="1800" height="1120" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><defs><marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="560" fill="#FFFFFF"/><text x="450" y="28" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Arquitectura por capas (la dependencia apunta siempre hacia el dominio)</text><rect x="60" y="80" width="560" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/><text x="340" y="108" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="bold">API REST (FastAPI)</text><text x="340" y="132" font-size="10.5" fill="#0C447C" text-anchor="middle">Rutas HTTP, esquemas Pydantic, traducción de errores a códigos HTTP</text><text x="340" y="152" font-size="10.5" fill="#0C447C" text-anchor="middle" font-style="italic">src/api</text><rect x="60" y="200" width="560" height="90" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/><text x="340" y="228" font-size="14" fill="#085041" text-anchor="middle" font-weight="bold">Aplicación (Service Layer)</text><text x="340" y="252" font-size="10.5" fill="#085041" text-anchor="middle">Un método por caso de uso: permisos, Unit of Work, publicar eventos</text><text x="340" y="272" font-size="10.5" fill="#085041" text-anchor="middle" font-style="italic">src/application</text><rect x="60" y="320" width="560" height="90" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.6"/><text x="340" y="348" font-size="14" fill="#633806" text-anchor="middle" font-weight="bold">Dominio (DDD)</text><text x="340" y="372" font-size="10.5" fill="#633806" text-anchor="middle">Agregados, entidades, value objects, specifications, máquina de estados, eventos</text><text x="340" y="392" font-size="10.5" fill="#633806" text-anchor="middle" font-style="italic">src/domain</text><rect x="60" y="440" width="560" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/><text x="340" y="468" font-size="14" fill="#3C3489" text-anchor="middle" font-weight="bold">Infraestructura</text><text x="340" y="492" font-size="10.5" fill="#3C3489" text-anchor="middle">SQLAlchemy/PostgreSQL, repositorios en memoria, pasarela simulada, configuración</text><text x="340" y="512" font-size="10.5" fill="#3C3489" text-anchor="middle" font-style="italic">src/infrastructure</text><polyline points="340,170 340,200" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#f)"/><polyline points="340,290 340,320" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#f)"/><polyline points="340,440 340,410" fill="none" stroke="#444" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#f)"/><text x="352" y="428" font-size="10" fill="#2C2C2A" text-anchor="start" font-style="italic">implementa los puertos (UnidadDeTrabajo, repositorios)</text><rect x="660" y="80" width="210" height="400" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/><text x="765" y="108" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Reglas de dependencia</text><text x="678" y="134" font-size="10.5" fill="#2C2C2A" text-anchor="start">El dominio no importa nada</text><text x="678" y="152" font-size="10.5" fill="#2C2C2A" text-anchor="start">de las otras capas.</text><text x="678" y="170" font-size="10.5" fill="#2C2C2A" text-anchor="start"></text><text x="678" y="188" font-size="10.5" fill="#2C2C2A" text-anchor="start">La aplicación solo conoce</text><text x="678" y="206" font-size="10.5" fill="#2C2C2A" text-anchor="start">contratos (puertos) del</text><text x="678" y="224" font-size="10.5" fill="#2C2C2A" text-anchor="start">dominio.</text><text x="678" y="242" font-size="10.5" fill="#2C2C2A" text-anchor="start"></text><text x="678" y="260" font-size="10.5" fill="#2C2C2A" text-anchor="start">La infraestructura</text><text x="678" y="278" font-size="10.5" fill="#2C2C2A" text-anchor="start">implementa esos contratos.</text><text x="678" y="296" font-size="10.5" fill="#2C2C2A" text-anchor="start"></text><text x="678" y="314" font-size="10.5" fill="#2C2C2A" text-anchor="start">composicion.py arma</text><text x="678" y="332" font-size="10.5" fill="#2C2C2A" text-anchor="start">las piezas en un solo lugar.</text><text x="678" y="350" font-size="10.5" fill="#2C2C2A" text-anchor="start"></text><text x="678" y="368" font-size="10.5" fill="#2C2C2A" text-anchor="start">Configuración: variables</text><text x="678" y="386" font-size="10.5" fill="#2C2C2A" text-anchor="start">de entorno (12-Factor).</text></svg>
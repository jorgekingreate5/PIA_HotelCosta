# Blueprint de Render: crea la API (Docker) y una base PostgreSQL gratuita.
databases:
  - name: hotel-db
    plan: free
    databaseName: hotel
services:
  - type: web
    name: hotel-costa-azul-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-db
          property: connectionString
      - key: CARGAR_DATOS_DEMO
        value: "1"
      - key: BENEFICIO_UMBRAL_MXN
        value: "1500"
